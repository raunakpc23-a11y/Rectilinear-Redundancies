          const handleReview = (quality) => {
            if (!currentCard) return;

            let newInterval = currentCard.interval;
            let newEase = currentCard.easeFactor;

            if (quality === 0) { 
              newInterval = 0;
              newEase = Math.max(1.3, newEase - 0.2);
            } else if (quality === 1) { 
              newInterval = newInterval === 0 ? 1 : newInterval * 1.2;
              newEase = Math.max(1.3, newEase - 0.15);

              newInterval = newInterval === 0 ? 1 : (newInterval === 1 ? 6 : newInterval * newEase);
            } else if (quality === 3) { 
              newInterval = newInterval === 0 ? 4 : (newInterval === 1 ? 6 : newInterval * newEase * 1.3);
              newEase += 0.15;
            }

            const nextReviewTime = Date.now() + (newInterval * 24 * 60 * 60 * 1000); 

            const updatedCards = userData.flashcards.map(c => 
              c.id === currentCard.id 
                ? { ...c, interval: newInterval, easeFactor: newEase, nextReview: nextReviewTime }
                : c
            );

            updateData('flashcards', updatedCards);
            setIsFlipped(false);
            
            if (activeCardIndex >= dueCards.length - 1) {
              setActiveCardIndex(0); 
            }

        // --- TASK BOARD MODULE ---
        const TaskBoard = ({ theme, userData, updateData }) => {
          const tasks = userData?.tasks || [];
          const [newTask, setNewTask] = useState('');
          const [draggedTaskId, setDraggedTaskId] = useState(null);

          const columns = [
            { id: 'todo', title: 'To Do', color: 'bg-slate-100 dark:bg-slate-800/50' },
            { id: 'in-progress', title: 'In Progress', color: 'bg-blue-50 dark:bg-blue-900/10' },
            { id: 'done', title: 'Completed', color: 'bg-emerald-50 dark:bg-emerald-900/10' }
          ];

          const handleDragStart = (e, id) => {
            setDraggedTaskId(id);
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => { e.target.style.opacity = '0.5'; }, 0);
          };

          const handleDragEnd = (e) => {
            e.target.style.opacity = '1';
            setDraggedTaskId(null);
          };

          const handleDragOver = (e) => {
            e.preventDefault(); 
            e.dataTransfer.dropEffect = 'move';
          };

          const handleDrop = (e, status) => {
            e.preventDefault();
            if (!draggedTaskId) return;
            
            const updatedTasks = tasks.map(t => 
              t.id === draggedTaskId ? { ...t, status } : t
            );
            updateData('tasks', updatedTasks);
          };

          const addTask = (e) => {
            e.preventDefault();
            if (!newTask.trim()) return;
            const newTaskObj = { id: Date.now(), text: newTask, status: 'todo' };
            updateData('tasks', [...tasks, newTaskObj]);
            setNewTask('');
          };

          return (
            <div className="animate-in fade-in duration-500 h-full flex flex-col">
              <div className="mb-6 flex-shrink-0">
                <h2 className="text-3xl font-bold text-slate-800 dark:text-white tracking-tight mb-2">Task Flow</h2>
                <p className="text-slate-500 dark:text-slate-400 text-sm max-w-2xl">
                  Organize your tasks visually. Drag and drop cards between columns to track them from creation to completion.
                </p>
              </div>

              <div className="mb-6 flex-shrink-0">
                <form onSubmit={addTask} className="relative max-w-md">
                  <input 
                    type="text" value={newTask} onChange={(e) => setNewTask(e.target.value)}
                    placeholder="Add a new task..." 
                    className="w-full bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl py-3 pl-4 pr-12 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                  <button type="submit" className={`absolute right-2 top-2 p-1.5 ${theme.primary} ${theme.hover} text-white rounded-xl transition-colors`}>
                    <Plus size={20} />
                  </button>
                </form>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1 min-h-0">
                {columns.map(column => (
                  <div 
                    key={column.id} 
                    className={`flex flex-col rounded-[2rem] p-4 border border-slate-100 dark:border-white/5 ${column.color}`}
                    onDragOver={handleDragOver}
                    onDrop={(e) => handleDrop(e, column.id)}
                  >
                    <div className="flex items-center justify-between mb-4 px-2">
                      <h3 className="font-bold text-slate-700 dark:text-slate-200">{column.title}</h3>
                      <span className="bg-white/50 dark:bg-black/20 text-slate-500 dark:text-slate-400 px-2.5 py-0.5 rounded-full text-xs font-semibold">
                        {tasks.filter(t => t.status === column.id).length}

                    <div className="flex-1 overflow-y-auto space-y-3">
                      {tasks.filter(t => t.status === column.id).map(task => (
                        <div

                          onDragStart={(e) => handleDragStart(e, task.id)}
                          onDragEnd={handleDragEnd}
                          className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-white/5 shadow-sm hover:shadow-md cursor-grab active:cursor-grabbing group transition-all"

                              {task.text}

                      ))}

                  </div>
                ))}

            </div>
          );
        };

        // --- POMODORO MODULE ---
        const PomodoroView = ({ theme, userData, updateData }) => {
          const [timeLeft, setTimeLeft] = useState(25 * 60);
          const [isActive, setIsActive] = useState(false);
          const [mode, setMode] = useState('focus');
          const sessionStartRef = useRef(null);

          useEffect(() => {
            let interval = null;
            if (isActive && timeLeft > 0) {
              if (!sessionStartRef.current) sessionStartRef.current = Date.now();
              interval = setInterval(() => setTimeLeft(timeLeft - 1), 1000);
            } else if (timeLeft === 0 && isActive) {
              setIsActive(false);
              if (mode === 'focus' && userData) {
                const newTotal = userData.analytics.totalFocusMinutes + 25;
                updateData('analytics', { ...userData.analytics, totalFocusMinutes: newTotal });
              }
              sessionStartRef.current = null;
            }
            return () => clearInterval(interval);
          }, [isActive, timeLeft, mode, userData, updateData]);

          const toggleTimer = () => setIsActive(!isActive);
          const resetTimer = () => {
            setIsActive(false);
            sessionStartRef.current = null;
            setTimeLeft(mode === 'focus' ? 25 * 60 : mode === 'shortBreak' ? 5 * 60 : 15 * 60);
          };

          const setTimerMode = (newMode) => {
            setMode(newMode);
            setIsActive(false);
            sessionStartRef.current = null;
            setTimeLeft(newMode === 'focus' ? 25 * 60 : newMode === 'shortBreak' ? 5 * 60 : 15 * 60);
          };

          const formatTime = (seconds) => {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
          };

          return (
            <div className="flex flex-col items-center justify-center min-h-[70vh] animate-in fade-in zoom-in-95 duration-500">
              <div className="bg-white dark:bg-white/5 p-10 rounded-[3rem] shadow-xl dark:shadow-2xl border border-slate-100 dark:border-white/5 max-w-md w-full text-center">
                <div className="flex justify-center space-x-2 mb-10 bg-slate-50 dark:bg-black/20 p-1.5 rounded-full">
                  {['focus', 'shortBreak', 'longBreak'].map((m) => (
                    <button
                      key={m}
                      onClick={() => setTimerMode(m)}
                      className={`px-5 py-2.5 rounded-full text-sm font-medium capitalize transition-all ${
                        mode === m 
                          ? 'bg-white dark:bg-white/10 text-slate-800 dark:text-white shadow-sm' 
                          : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'
                      }`}
                    >
                      {m.replace(/([A-Z])/g, ' $1').trim()}
                    </button>
                  ))}
                </div>

                <div className="text-[5.5rem] font-light text-slate-800 dark:text-white tracking-tighter mb-10 tabular-nums font-mono leading-none">
                  {formatTime(timeLeft)}
                </div>

                <div className="flex justify-center items-center space-x-6">
                  <button 
                    onClick={toggleTimer}
                    className={`w-20 h-20 rounded-full flex items-center justify-center text-white shadow-lg transition-transform hover:scale-105 active:scale-95 ${
                      isActive ? 'bg-rose-500 shadow-rose-500/30' : `${theme.primary} ${theme.shadow}`
                    }`}
                  >
                    {isActive ? <Pause size={32} /> : <Play size={32} className="ml-1.5" />}
                  </button>
                  <button 
                    onClick={resetTimer}
                    className="w-14 h-14 rounded-full bg-slate-50 dark:bg-white/5 flex items-center justify-center text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10 transition-colors"
                  >
                    <RotateCcw size={22} />
                  </button>
                </div>
              </div>
            </div>
          );
        };

        // --- AUDIO MIXER MODULE ---
        const AudioMixerView = ({ theme }) => {
          const [sounds, setSounds] = useState(INITIAL_SOUNDS);

          const togglePlay = (id) => {
            setSounds(sounds.map(s => s.id === id ? { ...s, playing: !s.playing } : s));
          };

          const handleVolumeChange = (id, newVolume) => {
            setSounds(sounds.map(s => s.id === id ? { ...s, volume: parseInt(newVolume) } : s));
          };

          const stopAll = () => {
            setSounds(sounds.map(s => ({ ...s, playing: false })));
          };

          const activeCount = sounds.filter(s => s.playing).length;

          return (
            <div className="space-y-8 animate-in fade-in duration-500 max-w-6xl">
              <div className="flex justify-between items-end">
                <div>
                  <h2 className="text-3xl font-bold text-slate-800 dark:text-white tracking-tight">Audio Mixer</h2>
                  <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">Blend environments to create your perfect focus zone.</p>
                </div>
                {activeCount > 0 && (
                  <button 
                    onClick={stopAll}
                    className="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 transition-colors flex items-center bg-white dark:bg-white/5 px-4 py-2 rounded-xl border border-slate-200 dark:border-white/10 shadow-sm"
                  >
                    <VolumeX size={16} className="mr-1.5" /> Stop All

                )}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                {sounds.map((sound) => (
                  <div key={sound.id} className={`p-6 rounded-[2rem] border transition-all duration-300 ${
                    sound.playing 
                      ? `${theme.bgLight} border-transparent dark:border-transparent ${theme.bgDark} shadow-sm scale-[1.02]` 
                      : 'bg-white border-slate-100 dark:bg-white/5 dark:border-white/5 hover:border-slate-200 dark:hover:border-white/10'
                  }`}>
                    <div className="flex flex-col items-center text-center space-y-4 mb-4">
                      <button 
                        onClick={() => togglePlay(sound.id)}
                        className={`w-20 h-20 text-3xl rounded-3xl flex items-center justify-center transition-all ${
                          sound.playing 
                            ? `${theme.primary} text-white shadow-xl ${theme.shadow}` 
                            : 'bg-slate-50 text-slate-500 dark:bg-black/20 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/10 shadow-inner'
                        }`}
                      >
                        {sound.playing ? <Pause size={28} className="text-white absolute opacity-0 hover:opacity-100 transition-opacity" /> : <Play size={28} className="ml-1 text-slate-400 dark:text-slate-500 absolute opacity-0 hover:opacity-100 transition-opacity" />}
                        <span className={`transition-opacity ${sound.playing ? 'opacity-20 hover:opacity-0' : ''}`}>{sound.icon}</span>
                      </button>
                      <div>
                        <h3 className={`font-bold ${sound.playing ? 'text-slate-900 dark:text-white' : 'text-slate-700 dark:text-slate-300'}`}>{sound.name}</h3>
                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{sound.desc}</p>
                      </div>
                    </div>
                    
                    <div className={`transition-all duration-500 overflow-hidden ${sound.playing ? 'h-16 opacity-100' : 'h-0 opacity-0'}`}>
                       <div className="h-6 w-full flex items-end justify-center space-x-1 opacity-60 mb-4">
                          {[...Array(8)].map((_, i) => (
                            <div key={i} className={`w-1.5 rounded-full ${theme.primary} animate-pulse`} 
                                 style={{ 
                                   height: `${Math.random() * (sound.volume / 100) * 100}%`, 
                                   animationDelay: `${i * 0.1}s`, 
                                   animationDuration: '0.5s' 
                                 }} />
                          ))}
                       </div>
                       <div className="flex items-center space-x-3 px-2">
                         <Volume2 size={16} className={theme.text} />
                         <input 
                            type="range" min="0" max="100" 
                            value={sound.volume}
                            onChange={(e) => handleVolumeChange(sound.id, e.target.value)}
                            className="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer"
                            style={{ 
                               background: `linear-gradient(to right, var(--tw-colors-indigo-500) 0%, var(--tw-colors-indigo-500) ${sound.volume}%, transparent ${sound.volume}%)` 
                            }} 
                         />
                       </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        };

        // --- ANALYTICS MODULE ---
        const AnalyticsView = ({ theme, userData }) => {
          const analytics = userData?.analytics;
          if (!analytics) return null;

          const maxHours = Math.max(...analytics.weeklyData.map(d => d.hours), 1); 

          return (
            <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500 max-w-5xl">
              <div className="mb-8">
                <h2 className="text-3xl font-bold text-slate-800 dark:text-white tracking-tight">Study Analytics</h2>
                <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">Track your progress and focus trends.</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white dark:bg-white/5 p-6 rounded-[2rem] border border-slate-100 dark:border-white/5 flex items-center space-x-4 shadow-sm">
                  <div className={`p-4 rounded-2xl ${theme.bgLight} ${theme.text} ${theme.bgDark}`}>
                    <Clock size={24} />
                  </div>
                  <div>
                    <p className="text-sm text-slate-500 dark:text-slate-400 font-medium mb-1">Focus Time</p>
                    <p className="text-2xl font-bold text-slate-800 dark:text-white">{Math.floor(analytics.totalFocusMinutes / 60)}h {analytics.totalFocusMinutes % 60}m</p>
                  </div>
                </div>
                <div className="bg-white dark:bg-white/5 p-6 rounded-[2rem] border border-slate-100 dark:border-white/5 flex items-center space-x-4 shadow-sm">
                  <div className={`p-4 rounded-2xl bg-emerald-50 text-emerald-500 dark:bg-emerald-500/10`}>
                    <BrainCircuit size={24} />
                  </div>
                  <div>
                    <p className="text-sm text-slate-500 dark:text-slate-400 font-medium mb-1">Cards Mastered</p>
                    <p className="text-2xl font-bold text-slate-800 dark:text-white">{analytics.cardsMastered}</p>
                  </div>
                </div>
                <div className="bg-white dark:bg-white/5 p-6 rounded-[2rem] border border-slate-100 dark:border-white/5 flex items-center space-x-4 shadow-sm">
                  <div className={`p-4 rounded-2xl bg-orange-50 text-orange-500 dark:bg-orange-500/10`}>
                    <CheckCircle size={24} />
                  </div>
                  <div>
                    <p className="text-sm text-slate-500 dark:text-slate-400 font-medium mb-1">Tasks Completed</p>
                    <p className="text-2xl font-bold text-slate-800 dark:text-white">{analytics.tasksCompleted}</p>
                  </div>
                </div>
              </div>

              <div className="bg-white dark:bg-white/5 p-8 rounded-[2rem] border border-slate-100 dark:border-white/5 shadow-sm">
                <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-6">Hours Studied This Week</h3>
                <div className="flex items-end justify-between h-64 mt-4 gap-2">
                  {analytics.weeklyData.map((day, idx) => {
                    const heightPercent = (day.hours / maxHours) * 100;
                    return (
                      <div key={idx} className="flex flex-col items-center flex-1 group">
                        <div className="opacity-0 group-hover:opacity-100 transition-opacity mb-2 text-xs font-bold text-slate-600 dark:text-slate-300">
                          {day.hours}h
                        </div>
                        <div className="w-full relative flex justify-center flex-1">
                          <div 
                            className={`absolute bottom-0 w-full max-w-[3rem] rounded-t-xl transition-all duration-700 ease-out ${theme.primary} ${theme.shadow} opacity-80 group-hover:opacity-100`}
                            style={{ height: `${heightPercent}%` }}
                          />
                        </div>
                        <span className="mt-4 text-sm font-medium text-slate-500 dark:text-slate-400">{day.day}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        };

        // --- SETTINGS MODULE ---
        const SettingsView = ({ isDarkMode, setIsDarkMode, currentTheme, setTheme, currentShade, setShade, theme }) => (
          <div className="max-w-3xl animate-in fade-in duration-500 space-y-8 pb-10">
            <div>
              <h2 className="text-3xl font-bold text-slate-800 dark:text-white tracking-tight">Settings</h2>
              <p className="text-slate-500 dark:text-slate-400 text-sm mt-2">Customize your workspace appearance and behavior.</p>
            </div>

            <div className="space-y-6">
              <div className="bg-white dark:bg-white/5 rounded-[2rem] p-8 border border-slate-100 dark:border-white/5 shadow-sm">
                 <div className="flex items-center space-x-3 mb-8">
                   <div className={`p-2 rounded-lg ${theme.bgLight} ${theme.bgDark} ${theme.text}`}>
                     <Palette size={20} />
                   </div>
                   <h3 className="text-xl font-semibold text-slate-800 dark:text-white">Theme & Colors</h3>
                 </div>

                 <div className="space-y-8">
                   <div>
                     <label className="text-sm font-semibold text-slate-700 dark:text-slate-300 block mb-4">Color Mode</label>
                     <div className="flex space-x-4">
                       <button onClick={() => setIsDarkMode(false)} className={`flex items-center space-x-2 px-6 py-3 rounded-2xl border transition-all ${!isDarkMode ? `${theme.border} ${theme.bgLight} ${theme.text} ring-2 ${theme.ring} ring-offset-2` : 'border-slate-200 dark:border-white/10 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-white/5'}`}> 
                         <Sun size={18} /> <span className="font-medium">Light</span>
                       </button>
                       <button onClick={() => setIsDarkMode(true)} className={`flex items-center space-x-2 px-6 py-3 rounded-2xl border transition-all ${isDarkMode ? `${theme.borderDark} ${theme.bgDark} ${theme.text} ring-2 ${theme.ring} ring-offset-2 dark:ring-offset-slate-900` : 'border-slate-200 dark:border-white/10 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-white/5'}`}> 
                         <Moon size={18} /> <span className="font-medium">Dark</span>
                       </button>
                     </div>
                   </div>

                   <div>
                     <label className="text-sm font-semibold text-slate-700 dark:text-slate-300 block mb-4">Accent Color</label>
                     <div className="flex space-x-4">
                       {Object.entries(THEMES).map(([key, t]) => (
                         <button 
                           key={key} 
                           onClick={() => setTheme(key)} 
                           className={`w-12 h-12 rounded-full flex items-center justify-center transition-transform hover:scale-110 ${t.primary} ${currentTheme === key ? `ring-4 ring-offset-2 dark:ring-offset-[#111] ${t.ring}` : 'opacity-80 hover:opacity-100'}`}
                         >
                            {currentTheme === key && <CheckCircle size={20} className="text-white drop-shadow-sm" />}
                         </button>
                       ))}
                     </div>
                   </div>

                   {isDarkMode && (
                     <div className="animate-in fade-in slide-in-from-top-2 duration-300 pt-2">
                       <label className="text-sm font-semibold text-slate-700 dark:text-slate-300 block mb-4">Dark Mode Background</label>
                       <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                         {Object.entries(SHADES).map(([key, s]) => (
                           <button 
                             key={key} 
                             onClick={() => setShade(key)} 
                             className={`p-5 rounded-2xl border text-left transition-all ${currentShade === key ? `${theme.borderDark} ${theme.bgDark}` : 'border-transparent bg-white/5 hover:bg-white/10'}`}
                           >
                             <div className="font-medium text-white mb-3">{s.name}</div>
                             <div className={`w-full h-10 rounded-xl ${key === 'slate' ? 'bg-slate-950' : key === 'midnight' ? 'bg-[#060913]' : 'bg-black'} border border-white/10 shadow-inner`}></div>
                           </button>
                         ))}
                       </div>
                     </div>
                   )}
                 </div>
              </div>
            </div>
          </div>
        );


        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        function App() {
          const [activeTab, setActiveTab] = useState('lectures');
          const [isDarkMode, setIsDarkMode] = useState(false);
          const [currentTheme, setCurrentTheme] = useState('indigo');
          const [currentShade, setCurrentShade] = useState('slate');
          
          const [currentUserId, setCurrentUserId] = useState('demo-user-123');
          const [userData, setUserData] = useState(null);

          // Initial Load Simulation
          useEffect(() => {
            setTimeout(() => { setUserData(MOCK_DB.users[currentUserId]); }, 500);
          }, [currentUserId]);

          const updateData = (key, newData) => {
            setUserData(prev => ({ ...prev, [key]: newData }));
          };

          const theme = THEMES[currentTheme];
          const shade = SHADES[currentShade];

          useEffect(() => {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setIsDarkMode(true);
          }, []);

          useEffect(() => {
            if (isDarkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
          }, [isDarkMode]);

          const renderContent = () => {
            // Loading State
            if (!userData) {
              return (
                <div className="flex h-full items-center justify-center animate-in fade-in duration-500">
                   <div className="flex flex-col items-center space-y-4">
                     <div className={`p-4 rounded-full ${theme.bgLight} ${theme.bgDark}`}>
                       <BookOpen className={`animate-pulse ${theme.text}`} size={32} />
                     </div>
                     <p className="text-sm font-medium text-slate-500 dark:text-slate-400">Loading Dashboard...</p>
                   </div>
                </div>
              );
            }

            switch (activeTab) {
              case 'analytics': return <AnalyticsView theme={theme} userData={userData} />;
              case 'lectures': return <LecturesView theme={theme} userData={userData} updateData={updateData} />;
              case 'flashcards': return <FlashcardsView theme={theme} userData={userData} updateData={updateData} />;
              case 'pomodoro': return <PomodoroView theme={theme} userData={userData} updateData={updateData} />;
              case 'audio': return <AudioMixerView theme={theme} />;
              case 'tasks': return <TaskBoard theme={theme} userData={userData} updateData={updateData} />;
              case 'settings': return <SettingsView isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} currentTheme={currentTheme} setTheme={setCurrentTheme} currentShade={currentShade} setShade={setCurrentShade} theme={theme} />;
              default: return <LecturesView theme={theme} userData={userData} updateData={updateData} />;
            }
          };

          return (
            <div className={`min-h-screen flex`}>
              
              {/* DESKTOP SIDEBAR */}
              <aside className={`w-[280px] border-r flex-shrink-0 hidden md:flex flex-col transition-colors duration-300 ${isDarkMode ? `${shade.panel} ${shade.border}` : 'bg-white border-slate-200'}`}>
                <div className={`h-20 flex items-center px-8 border-b ${isDarkMode ? shade.border : 'border-slate-100'}`}>
                  <div className={`w-9 h-9 ${theme.primary} rounded-xl flex items-center justify-center mr-3 ${theme.shadow}`}>
                    <BookOpen size={20} className="text-white" />
                  </div>
                  <h1 className="font-bold text-xl tracking-tight text-slate-800 dark:text-white">StudySpace</h1>
                </div>
                
                <div className="p-5 flex-1 space-y-2 overflow-y-auto scrollbar-hide">
                  <p className="px-4 text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-4 mt-2">Dashboard</p>
                  <SidebarItem icon={BarChart3} label="Analytics" active={activeTab === 'analytics'} onClick={() => setActiveTab('analytics')} theme={theme} />
                  <SidebarItem icon={Layers} label="Flashcards" active={activeTab === 'flashcards'} onClick={() => setActiveTab('flashcards')} theme={theme} />
                  
                  <p className="px-4 text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-4 mt-8">Study Tools</p>
                  <SidebarItem icon={Video} label="Lectures" active={activeTab === 'lectures'} onClick={() => setActiveTab('lectures')} theme={theme} />
                  <SidebarItem icon={List} label="Task Flow" active={activeTab === 'tasks'} onClick={() => setActiveTab('tasks')} theme={theme} />
                  <SidebarItem icon={Clock} label="Timer" active={activeTab === 'pomodoro'} onClick={() => setActiveTab('pomodoro')} theme={theme} />
                  <SidebarItem icon={Headphones} label="Audio Mixer" active={activeTab === 'audio'} onClick={() => setActiveTab('audio')} theme={theme} />
                </div>

                <div className={`p-5 border-t ${isDarkMode ? shade.border : 'border-slate-100'}`}>
                  <button onClick={() => setActiveTab('settings')} className={`flex items-center space-x-3 w-full px-4 py-3 rounded-2xl transition-all ${activeTab === 'settings' ? `${theme.bgLight} ${theme.bgDark} ${theme.text}` : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5'}`}>
                    <Settings size={20} />
                    <span className="font-medium text-sm">Settings</span>
                  </button>
                </div>
              </aside>

              {/* MAIN CONTENT AREA */}
              <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                
                {/* TOP HEADER */}
                <header className={`h-20 flex items-center justify-between px-6 md:px-10 backdrop-blur-xl border-b z-10 transition-colors duration-300 ${isDarkMode ? `${shade.panel}/80 ${shade.border}` : 'bg-white/70 border-transparent'}`}>
                  <div className="flex items-center md:hidden">
                     <div className={`w-8 h-8 ${theme.primary} rounded-lg flex items-center justify-center mr-3`}>
                      <BookOpen size={18} className="text-white" />
                    </div>
                  </div>
                  <div className="hidden md:flex items-center text-sm text-slate-500 dark:text-slate-400 font-medium">
                     <span>Workspace</span><ChevronRight size={14} className="mx-2 opacity-40" />
                     <span className="capitalize text-slate-800 dark:text-slate-200">{activeTab}</span>
                  </div>
                  <div className="flex items-center space-x-5">
                    <button onClick={() => setActiveTab('settings')} className="p-2.5 rounded-full md:hidden text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-white/5 transition-colors focus:outline-none">
                       <Settings size={20} />
                    </button>
                    <div className={`w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm ${theme.bgLight} ${theme.text} ${theme.bgDark} border ${theme.border} ${theme.borderDark}`}>
                      {userData?.profile?.name?.[0] || 'U'}
                    </div>
                  </div>
                </header>

                <div className="flex-1 overflow-y-auto p-5 md:p-10 relative">
                   {renderContent()}
                </div>

                {/* MOBILE BOTTOM NAVIGATION */}
                <nav className={`md:hidden border-t p-2 flex justify-around overflow-x-auto transition-colors duration-300 scrollbar-hide ${isDarkMode ? `${shade.panel} ${shade.border}` : 'bg-white border-slate-200'}`}>
                  {[
                    { id: 'lectures', icon: Video, label: 'Lectures' },
                    { id: 'flashcards', icon: Layers, label: 'Cards' },
                    { id: 'tasks', icon: List, label: 'Tasks' },
                    { id: 'pomodoro', icon: Clock, label: 'Timer' },
                    { id: 'audio', icon: Headphones, label: 'Audio' },
                  ].map((item) => (
                    <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex flex-col items-center p-2 rounded-xl min-w-[64px] flex-shrink-0 transition-colors ${activeTab === item.id ? theme.text : 'text-slate-400 hover:bg-slate-50 dark:hover:bg-white/5'}`}>
                      <item.icon size={20} className="mb-1" />
                      <span className="text-[10px] font-semibold">{item.label}</span>
                    </button>
                  ))}
                </nav>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
