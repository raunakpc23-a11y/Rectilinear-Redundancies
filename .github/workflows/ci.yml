name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check server script
        run: node --check server/server.js

      - name: Syntax check client scripts
        run: |
          node --check js/config.js
          node --check js/script.js
          node --check js/sealion.js
          node --check js/audio.js
          node --check js/quizrr.js
          node --check js/cards.js
          node --check js/data.js
          node --check js/songs.js
          node --check js/v2-ui.js

      - name: Verify JSON integrity
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
