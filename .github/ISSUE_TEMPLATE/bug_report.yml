name: Bug Report
description: Report a reproducible bug or unexpected behavior in Rectilinear Redundancies
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Rectilinear Redundancies! Please describe the issue clearly.

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: What browser and operating system were you using?
      placeholder: e.g. Chrome 122 on Windows 11 / Safari on iOS 17
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open dashboard
        2. Click on 'Pomodoro'
        3. Switch to AMOLED theme
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
