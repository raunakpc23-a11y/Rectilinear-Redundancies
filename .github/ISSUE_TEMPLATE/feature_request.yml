name: Feature Request
description: Propose a new feature, theme, or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature, flashcard set, or visual theme? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature related to a problem?
      description: A clear and concise description of the limitation or friction you experienced.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you considered.
    validations:
      required: false
